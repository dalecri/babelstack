:root{

button,input{font:inherit;color:inherit}
button{background:var(--chip);border:1px solid var(--rule);border-radius:2px;padding:6px 10px;cursor:pointer;text-transform:lowercase;letter-spacing:.02em;white-space:nowrap}

.sl{display:flex;align-items:center;gap:6px;text-transform:lowercase}

    if (L) m = new THREE.MeshBasicMaterial({ color: 0xffffff, map: tex(f, 'line'), ...off });
    else if (f === 'glass') m = new THREE.MeshPhongMaterial({ map: tex(f, 'shade'), vertexColors: true, specular: 0x8a96a8, shininess: 70, ...off });

// "Realistic emboss": a light rim on the lit side and a soft dark rim on the far side press the drawing into the paper.
const EMBOSS = k => `drop-shadow(${-0.8 * k}px ${-0.8 * k}px 0 rgba(255,255,255,.75)) drop-shadow(${0.9 * k}px ${1.1 * k}px ${0.6 * k}px rgba(70,60,45,.22))`;

// ===== camera framing, resize, loop =====
let dirty = true;
function frame(P) {
  const H = P.top, W = P.plinth + (P.ground.kind === 'plaza' ? 0 : 7);
  S.view = 0.816 * (H + W * 0.62) * 1.08;
  controls.target.set(0, H * 0.47, 0);
  camera.position.copy(controls.target).add(new THREE.Vector3(1, 0.8165, 1).normalize().multiplyScalar(120));

}
function resize() {
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1, a = w / h;
  renderer.setSize(w, h, false);
  let v = S.view || 30; if (a < 0.9) v = Math.max(v, (S.plan ? S.plan.plinth : 14) * 1.5 / a);
  Object.assign(camera, { left: -v * a / 2, right: v * a / 2, top: v / 2, bottom: -v / 2 }); camera.updateProjectionMatrix();

}
new ResizeObserver(resize).observe(stage);
let resumeT = 0;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(resumeT); });
controls.addEventListener('end', () => { clearTimeout(resumeT); resumeT = setTimeout(() => { controls.autoRotate = S.rotate; }, 4000); });
controls.addEventListener('change', () => { dirty = true; });
renderer.setAnimationLoop(() => {
  const moved = controls.update();
  if (controls.autoRotate && mats.g && S.plan.ground.kind === 'sea') mats.g.map.offset.set((performance.now() * 0.00002) % 1, 0);
  if (moved || dirty || controls.autoRotate) { renderer.render(scene, camera); dirty = false; }
});

// ===== export =====
const dlP = (window.claude && claude.use) ? claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function exportPNG() {
  const btn = $('png'), L = S.style === 'linework', w = stage.clientWidth, h = stage.clientHeight, long = Math.max(w, h);
  let scale = L ? Math.max(3, 3000 / long) : 2; scale = Math.min(scale, 4096 / long);
  const prev = renderer.getPixelRatio();
  renderer.setPixelRatio(scale); renderer.setSize(w, h, false);
  const db = renderer.getDrawingBufferSize(new THREE.Vector2()); lineMat.s.resolution.copy(db); lineMat.d.resolution.copy(db); setLineWidths(scale);
  renderer.render(scene, camera);

  const filename = `babelstack-${S.seed}${L ? '-linework' : ''}.png`;
  const flash = t => { btn.textContent = t; setTimeout(() => { btn.textContent = 'render png'; }, 1800); };
  const dl = await dlP;
  if (dl) {
    try { await dl.save({ filename, data: blob }); flash('saved'); }
    catch (e) { flash(e && e.code === 'declined' ? 'cancelled' : 'not saved'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); flash('saved');
}

// ===== controls =====
const seedEl = $('seed'), hEl = $('h'), cEl = $('c');
for (const k of STYLE_KEYS) { const b = document.createElement('button'); b.textContent = k; b.dataset.style = k; $('styles').append(b); }
function syncUI() {
  seedEl.value = S.daily ? DAILY_LABEL : S.seed;
  hEl.value = S.n; $('hv').textContent = S.n;
  cEl.value = Math.round(S.chaos * 100); $('cv').textContent = (S.chaos).toFixed(2).replace(/^0/, '');
  for (const b of $('styles').children) b.setAttribute('aria-pressed', String(b.dataset.style === S.style));
  $('rot').setAttribute('aria-pressed', String(S.rotate));
}
function setSeed(seed, daily = false) {
  S.seed = seed; S.daily = daily;
  const d = seedDefaults(seed); if (!S.hUser) S.n = d.n; if (!S.cUser) S.chaos = d.chaos;
  build();
}
function setRotate(on) { S.rotate = on; controls.autoRotate = on; syncUI(); }
$('new').onclick = () => setSeed(newSeed());
seedEl.addEventListener('focus', () => { if (S.daily) seedEl.value = S.seed; seedEl.select(); });
seedEl.addEventListener('blur', syncUI);
seedEl.addEventListener('keydown', e => { if (e.key === 'Enter') { const v = clean(seedEl.value); if (v) setSeed(v, v === DAILY); seedEl.blur(); } if (e.key === 'Escape') seedEl.blur(); });
$('copy').onclick = () => {
  const url = shareURL(), btn = $('copy'), done = t => { btn.textContent = t; setTimeout(() => { btn.textContent = 'copy link'; }, 1600); };
  try { navigator.clipboard.writeText(url).then(() => done('copied'), () => { seedEl.value = url; seedEl.select(); done('select'); }); }
  catch { seedEl.value = url; seedEl.select(); done('select'); }
};
let rebuildT = 0; const soon = () => { clearTimeout(rebuildT); rebuildT = setTimeout(build, 60); };
hEl.addEventListener('input', () => { S.n = +hEl.value; S.hUser = true; $('hv').textContent = S.n; soon(); });
cEl.addEventListener('input', () => { S.chaos = +cEl.value / 100; S.cUser = true; $('cv').textContent = S.chaos.toFixed(2).replace(/^0/, ''); soon(); });
$('styles').addEventListener('click', e => {
  const k = e.target.dataset && e.target.dataset.style; if (!k || k === S.style) return;
  const wasL = S.style === 'linework'; S.style = k;
  if (k === 'linework') { S.rotatePref = S.rotate; setRotate(false); } else if (wasL) setRotate(S.rotatePref);
  applyStyle(); syncUI();

$('rot').onclick = () => { setRotate(!S.rotate); S.rotatePref = S.rotate; };
$('png').onclick = exportPNG;
addEventListener('keydown', e => {

  e.preventDefault(); setSeed(newSeed());

// ===== boot =====
try { document.fonts.load('700 22px "Space Mono"').then(() => { for (const k in GTEX) { GTEX[k].dispose(); delete GTEX[k]; } if (S.plan) applyStyle(); }); } catch {}
{ const d = seedDefaults(S.seed); if (!S.hUser) S.n = d.n; if (!S.cUser) S.chaos = d.chaos; }
controls.autoRotate = S.rotate;
build();
</script>
